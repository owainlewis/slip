schemaVersion: 1
id: essential
title: What survives when code gets cheap
slides:
  - id: cover
    layout: type_only
    content:
      headline: |-
        You don't have a
        productivity problem.
        You have a taste
        problem, and it is
        getting expensive
      emphasis: taste
    options:
      align: center
      tone: ink
      emphasisStyle: italic
  - id: upstream
    layout: photo_full
    content:
      headline: |-
        The bottleneck
        moved upstream
      emphasis: upstream
      body: When output is abundant, deciding what deserves to exist becomes the work.
    image:
      src: ../../assets/sierra-nevada.jpg
      position: [0.48, 0.44]
      zoom: 1.15
    options:
      emphasisStyle: italic
  - id: survives
    layout: type_only
    content:
      headline: |-
        Writing the code was
        never the expensive
        part. Deciding what
        was worth writing
        always was
      emphasis: worth writing
    options:
      align: center
      tone: paper
      emphasisStyle: italic
  - id: wider-field
    layout: photo_full
    content:
      headline: |-
        Better tools widen
        the field. They don't
        hand you a point of view
      emphasis: widen
    image:
      src: ../../assets/person-at-laptop.png
      position: [0.58, 0.5]
      zoom: 1
    options:
      emphasisStyle: italic
  - id: close
    layout: type_only
    content:
      headline: |-
        Let the machine take
        the craft. Keep the
        reason for making it
      emphasis: reason
      body: Build the part no model can own.
    options:
      align: center
      tone: paper
      emphasisStyle: italic
