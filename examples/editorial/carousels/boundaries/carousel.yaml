schemaVersion: 1
id: boundaries
title: Focal boundaries
slides:
  - id: upper-left
    layout: photo_split
    content:
      headline: The focal point can reach the upper-left boundary without exposing empty space
      body: Cover, zoom, and deterministic clamping keep every requested crop inside the source image.
    image:
      src: ../../assets/portrait.svg
      position: [0, 0]
      zoom: 3
    options:
      side: left
  - id: lower-right
    layout: photo_band
    content:
      headline: The opposite boundary remains just as predictable
      caption: Normalized coordinates are inclusive from zero to one.
    image:
      src: ../../assets/landscape.svg
      position: [1, 1]
      zoom: 3
