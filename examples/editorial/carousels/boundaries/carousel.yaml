schemaVersion: 1
id: boundaries
title: Focal boundaries
slides:
  - id: upper-left
    layout: photo_split
    content:
      headline: |-
        A crop can reach
        the edge.
      emphasis: edge
      body: The requested focus stays deliberate, even at the upper-left boundary.
    image:
      src: ../../assets/sea-cliff.jpg
      position: [0, 0]
      zoom: 3
    options:
      side: left
      tone: paper
      emphasisStyle: italic
  - id: lower-right
    layout: photo_band
    content:
      headline: |-
        And still hold
        its ground.
      emphasis: hold
      caption: The opposite boundary is equally predictable. No gaps. No accidental drift.
    image:
      src: ../../assets/sierra-nevada.jpg
      position: [1, 1]
      zoom: 3
    options:
      tone: ink
      emphasisStyle: mark
